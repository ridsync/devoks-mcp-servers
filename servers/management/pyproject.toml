[project]
name = "devoks_mcp_management"
version = "0.1.0"
description = "Management MCP server — GitHub Knowledge adapter (Stage 1)"
requires-python = ">=3.14"
dependencies = [
    "mcp==2.1.1",
    # mcp==2.1.1 already depends on these transitively; declared explicitly
    # because this package imports them directly (see handover notes).
    "httpx2>=2.5.0",
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devoks_mcp_management"]

# No [tool.pytest.ini_options] here on purpose — it lives in the workspace root
# pyproject.toml alongside the ruff and pyright config. Duplicating it in both
# places invites the two copies to drift, and the root copy is the one a bare
# `uv run pytest` can find.

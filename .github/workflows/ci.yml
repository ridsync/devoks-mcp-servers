name: CI

# TASK-031 / REQ-007: lint + type-check + test + image build, plus a real
# container-startup smoke test against /healthz. Any single failure below
# fails the whole run (AC-007-3) — no step here uses `continue-on-error`.
#
# Runs on push to *every* branch (not just `main`) and on every pull_request,
# so pushes to a feature branch (e.g. `feat/1-management-mcp-bootstrap`) are
# covered too — narrowing `push.branches` to `main` would mean this pipeline
# never runs until the PR merges, which defeats its purpose as a pre-merge
# gate.
on:
  push:
  pull_request:

# Cancel a superseded run for the same ref (e.g. a rapid follow-up push)
# instead of letting it finish — saves runner minutes without weakening the
# gate (the newer commit's own run still has to pass).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow never pushes an image to a registry (that's Stage 2 / ECR,
# FRD §10) and never writes to the repository — read-only is sufficient for
# checkout + local `docker build`/`docker run`.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Quality gate: ruff (lint + format check), pyright, pytest.
  # Runs on the standard x64 runner — none of these steps touch the
  # container image or its target architecture, so there is no reason to pay
  # for (or wait on) an arm64 runner here.
  # -------------------------------------------------------------------------
  quality:
    name: Lint · type check · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # https://github.com/actions/checkout/releases — latest major v7, verified via GitHub API before pinning

      # Python version: deliberately NOT actions/setup-python. This project's
      # `.python-version` pins 3.14, and Python 3.14 is a hard floor here —
      # not just a preference (see servers/management/Dockerfile's own
      # "WHY python:3.14 SPECIFICALLY" note): client.py uses PEP 758
      # (parenthesis-free multi-exception `except`), a SyntaxError on 3.13.
      # astral-sh/setup-uv lets uv itself download and manage the exact
      # interpreter `.python-version` names (uv's default
      # UV_PYTHON_DOWNLOADS=automatic, unlike the Dockerfile which disables
      # it to reuse the base image's own interpreter) — one fewer moving
      # part than keeping a second tool's version pin in sync with
      # `.python-version`/`requires-python`.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1 # https://github.com/astral-sh/setup-uv/releases — no floating "v10" major tag exists (checked via GitHub API), so pinned to the exact latest release
        with:
          version: "0.11.4" # matches the uv version pinned in servers/management/Dockerfile (COPY --from=ghcr.io/astral-sh/uv:0.11.4), so CI and the image resolve/sync with the identical uv release
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .
        # No formatter is run for this workflow file itself: `ruff format`
        # only targets Python (config.py's [tool.ruff] src = the Python
        # source/test dirs). YAML has no project formatter configured — the
        # PLAN task report notes this explicitly rather than silently
        # skipping it.

      - name: pyright
        run: uv run pyright

      - name: pytest
        run: uv run pytest -q

  # -------------------------------------------------------------------------
  # Image build (CTR-010 = linux/arm64) + container-startup smoke test
  # (AC-007-2). Runs independently of `quality` (no `needs:`) rather than
  # after it — this repository is public, so GitHub-hosted runner minutes
  # (including arm64) are free and unlimited, so there is no runner-usage
  # reason to serialize; running both jobs in parallel instead gives faster
  # end-to-end feedback on push, which matters more here (a human is waiting
  # on the result). Both jobs must still pass for the overall run to be
  # green — GitHub Actions already fails the run if any job fails, which is
  # what AC-007-3 requires.
  #
  # ARCHITECTURE DECISION (the trap flagged in the handover notes):
  # CTR-010 targets linux/arm64 (Fargate Graviton), but GitHub's *default*
  # hosted runner (ubuntu-latest) is amd64 — building arm64 there would need
  # QEMU emulation (docker/setup-qemu-action) for both the build and, worse,
  # for actually *running* the built image to curl /healthz, which is slow
  # and occasionally flaky under emulation.
  # Resolution: this job runs on `ubuntu-24.04-arm`, a *native* arm64
  # GitHub-hosted runner. Verified before choosing it (not assumed):
  #   1. This repository is public (`gh repo view` → "visibility": "PUBLIC"),
  #      and GitHub's docs (github/docs, actions/reference/runners) list
  #      standard arm64 Linux runners (`ubuntu-24.04-arm`, `ubuntu-22.04-arm`)
  #      as free and unlimited for public repositories, same as the x64
  #      standard runners — not a paid/limited tier.
  #   2. `ubuntu-24.04-arm`'s own image manifest (actions/runner-images,
  #      Ubuntu2404-Arm64-Readme.md) ships Docker Server/Client 28.0.4 and
  #      Docker-Buildx 0.36.1 preinstalled — no extra runner bootstrapping
  #      needed beyond docker/setup-buildx-action for the BuildKit features
  #      (`--mount=type=cache`, `--mount=type=bind`) the Dockerfile's first
  #      line (`# syntax=docker/dockerfile:1`) requires.
  # This is option (a) from the handover notes: no QEMU anywhere in this
  # job — the build is native and the smoke-tested container runs natively,
  # so the smoke test's timing/behavior is representative of the real
  # Fargate target instead of emulated.
      # TASK-048 — gate on *our* dependencies, not the base image.
      #
      # Placed after pytest so a red build is attributable: a failure here is
      # always "a dependency has a published fix we have not taken", never a
      # test regression. Deliberately scoped to `uv.lock`'s pinned Python
      # packages and to findings that *have* a fix — the container's Debian
      # CVEs (perl-base, glibc) have no fix in trixie, and gating on those
      # would produce a permanently red pipeline that everyone learns to
      # ignore. See the script's own docstring for the full rationale and for
      # why it exits 2 rather than 0 when the audit itself cannot run.
      #
      # `uv run python`, not the runner's `python3`: ruff formats this
      # repository for its Python 3.14 target, which means PEP 758's
      # parenthesis-free multi-exception `except` — and ubuntu-latest's system
      # python3 is 3.12, where that is a SyntaxError. Caught by this very step
      # failing on its first CI run. Same hard-floor trap the Dockerfile
      # documents for the container base image; any script in this repository
      # must run on the project interpreter, never the ambient one.
      - name: Audit dependencies (OSV)
        run: uv run python scripts/audit-dependencies.py

  docker:
    name: Docker build (arm64) + /healthz smoke + ECR push
    runs-on: ubuntu-24.04-arm
    # `id-token: write` is what lets this job exchange a GitHub OIDC token for
    # short-lived AWS credentials. Scoped to this job on purpose: the `quality`
    # job has no business holding an AWS identity.
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # https://github.com/docker/setup-buildx-action/releases — latest major v4, verified via GitHub API. Required for the Dockerfile's --mount=type=cache/--mount=type=bind BuildKit features (handover note).

      # Build context MUST be the repository root (uv.lock lives there, not
      # under servers/management/) — see servers/management/Dockerfile's own
      # top-of-file comment and the handover notes for TASK-031.
      # `platforms: linux/arm64` is technically redundant on a native arm64
      # runner (no cross-compilation is happening either way) but is kept
      # explicit so the build's intent matches CTR-010 in the workflow
      # source, not just implicitly via runner choice.
      # `load: true` pulls the built image into this runner's local Docker
      # daemon so the smoke-test step below can `docker run` it directly —
      # without it the image would only exist inside buildx's own builder
      # and `docker run` could not see it.
      - name: Build image
        uses: docker/build-push-action@v7 # https://github.com/docker/build-push-action/releases — latest major v7, verified via GitHub API
        with:
          context: .
          file: servers/management/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: devoks-mcp-management:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # AC-007-2 requires the container to be started with CTR-006's
      # required env vars and to answer /healthz with 200 — this step does
      # both, then polls with a timeout instead of assuming instant
      # readiness, and dumps container logs before failing so a startup
      # failure is diagnosable from the Actions log alone (no re-run needed
      # just to see why).
      - name: Start container and smoke-test /healthz
        run: |
          set -euo pipefail

          # GITHUB_APP_PRIVATE_KEY must be a PEM that actually parses
          # (config.py's Fail-Fast startup validation calls
          # cryptography's load_pem_private_key on it) — generating one here
          # with openssl needs no secret at all; this key never talks to
          # GitHub (lifespan token issuance is lazy — verified in TASK-023 —
          # so a container smoke test that only hits /healthz makes zero
          # GitHub API calls with it).
          openssl genrsa -out /tmp/ci-smoke-key.pem 2048

          # CTR-006's 8 required env vars (config.py's _REQUIRED_KEYS) —
          # create_app_from_env fails startup immediately if any is missing,
          # so all 8 must be present for /healthz to ever answer.
          # Values verified locally (uv run uvicorn + curl) before writing
          # this step, exactly as CI will run them:
          #   - MCP_PUBLIC_URL must end in "/mcp" with no trailing slash
          #     (config.py's _parse_public_url, CTR-001 well-known path
          #     derivation).
          #   - MCP_ALLOWED_HOSTS: /healthz itself is NOT gated by
          #     transport_security (app.py mounts it on the outer Starlette
          #     app, before Mount("/", mcp_app) — verified locally: curl
          #     with an arbitrary Host header against a running instance
          #     still returned 200). This value only matters for /mcp
          #     requests, which this smoke test does not make; "localhost"
          #     is supplied purely to satisfy the required-key check, and
          #     app.py's _expand_allowed_hosts already expands a bare host
          #     to both "localhost" and "localhost:*" forms.
          export MCP_ALLOWED_HOSTS="localhost"
          export MCP_PUBLIC_URL="https://ci.example.com/mcp"
          export MCP_ISSUER_URL="https://ci.example.com"
          # Generated per run, never a literal (TASK-046). Two reasons:
          #   1. config.py now enforces a 32-character floor on
          #      MCP_CLIENT_TOKENS keys, and the previous literal
          #      "smoke-token" (11 chars) would fail startup.
          #   2. More importantly, a token literal committed to a workflow
          #      file is a published credential the moment anyone copies it
          #      forward into a real deployment — which is exactly how the
          #      deployed Lambda ended up running with .env.example's
          #      placeholder token. The same reasoning as the openssl-generated
          #      PEM above: CI needs a *valid-shaped* credential, never a
          #      *reusable* one.
          CI_SMOKE_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export MCP_CLIENT_TOKENS="{\"$CI_SMOKE_TOKEN\":{\"client_id\":\"ci-smoke\",\"role\":\"reader\",\"scopes\":[\"devoks:read\"]}}"
          export MCP_ROLE_TOOLS='{"reader":["list_repos","get_repo_tree","read_file","search_code"]}'
          export GITHUB_APP_ID="000000000"
          GITHUB_APP_PRIVATE_KEY="$(cat /tmp/ci-smoke-key.pem)"
          export GITHUB_APP_PRIVATE_KEY
          export GITHUB_APP_INSTALLATION_ID="00000000"

          # `-e VAR` (no "=value") passes the value through from this shell's
          # own environment rather than being written inline as a `docker
          # run` argument — needed for GITHUB_APP_PRIVATE_KEY, which is a
          # multi-line PEM that would otherwise have to survive shell word
          # splitting/argument quoting.
          docker run -d --name mcp-smoke -p 8000:8000 \
            -e MCP_ALLOWED_HOSTS \
            -e MCP_PUBLIC_URL \
            -e MCP_ISSUER_URL \
            -e MCP_CLIENT_TOKENS \
            -e MCP_ROLE_TOOLS \
            -e GITHUB_APP_ID \
            -e GITHUB_APP_PRIVATE_KEY \
            -e GITHUB_APP_INSTALLATION_ID \
            devoks-mcp-management:ci

          status=""
          for attempt in $(seq 1 30); do
            if status=$(curl -s -o /tmp/healthz-body.json -w '%{http_code}' http://localhost:8000/healthz); then
              if [ "$status" = "200" ]; then
                echo "GET /healthz -> 200 on attempt ${attempt}"
                break
              fi
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::container did not answer GET /healthz with 200 within 30s (last status: ${status:-<connection failed>})"
              echo "--- docker logs mcp-smoke ---"
              docker logs mcp-smoke || true
              exit 1
            fi
            sleep 1
          done

          echo "--- /healthz response body ---"
          cat /tmp/healthz-body.json
          echo

          # AC-001-3 / this task's own smoke requirement: the body must
          # carry the server name and version, not just an empty 200.
          if ! grep -q '"name"' /tmp/healthz-body.json || ! grep -q '"version"' /tmp/healthz-body.json; then
            echo "::error::/healthz responded 200 but body is missing 'name' or 'version'"
            docker logs mcp-smoke || true
            exit 1
          fi

      - name: Dump container logs (failure diagnostics)
        if: failure()
        run: docker logs mcp-smoke || true

      # Only a build that answered /healthz gets published. Placing the push
      # after the smoke test means a broken image never reaches ECR, so the
      # registry only ever holds images that at least start.
      #
      # `push` events only: a pull_request run would publish a duplicate of a
      # commit that is already being built on its branch, and fork PRs cannot
      # get an OIDC token with these permissions anyway.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6 # verified via GitHub API: v6 tag exists (latest v6.2.4)
        with:
          role-to-assume: arn:aws:iam::703630528452:role/devoks-mcp-github-actions
          aws-region: ap-northeast-2
          # Not a secret — an ARN is an identifier. The trust policy, not
          # obscurity, is what restricts who may assume this role.

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2 # verified via GitHub API: v2 tag exists (latest v2.1.7)

      # Tagged by commit SHA always, so any deployed task definition names an
      # exact build. `latest` moves only on the default branch — a feature
      # branch that also moved it would make `latest` mean "whoever pushed
      # most recently", which is not something to deploy from.
      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: devoks-mcp-management
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag devoks-mcp-management:ci "$REGISTRY/$REPOSITORY:$SHA"
          docker push "$REGISTRY/$REPOSITORY:$SHA"
          echo "pushed $REGISTRY/$REPOSITORY:$SHA"

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            docker tag devoks-mcp-management:ci "$REGISTRY/$REPOSITORY:latest"
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "pushed $REGISTRY/$REPOSITORY:latest"
          else
            echo "not the default branch - leaving :latest untouched"
          fi

          {
            echo "### Image pushed to ECR"
            echo ""
            echo '```'
            echo "$REGISTRY/$REPOSITORY:$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # TASK-061 — deploy the image this job just verified.
      #
      # Gated on the default branch, not merely on `push`: the ECR push above
      # tags every branch build by SHA (useful for inspection), but pointing
      # the live function at a feature branch's image would make `main` stop
      # describing what is deployed.
      #
      # `update-function-code` only swaps the image; environment variables are
      # left exactly as they are. That separation is deliberate — the two
      # URL-dependent variables (MCP_PUBLIC_URL / MCP_ALLOWED_HOSTS) are
      # bound to the Function URL by `infra/03-lambda.sh`'s two-phase
      # injection, and a deploy that also rewrote configuration could silently
      # revert them (EDGE-019: they and the Function URL host must agree, or
      # every request is a 421).
      #
      # Note the cold start: the first invocation after this step pays the
      # one-time image-optimization cost measured at ~8.5s (EDGE-016), not
      # the ~1.9s steady-state figure.
      - name: Deploy to Lambda
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: devoks-mcp-management
          FUNCTION: devoks-mcp-management
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --image-uri "$REGISTRY/$REPOSITORY:$SHA" \
            --publish \
            --query '{Version:Version,LastUpdateStatus:LastUpdateStatus}' \
            --output json

          # Block until the new image is actually live. Without this the job
          # goes green while the function is still `InProgress`, so a failed
          # image swap (a bad ENTRYPOINT, a missing layer) would surface only
          # to the next real caller.
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

          aws lambda get-function-configuration --function-name "$FUNCTION" \
            --query '{State:State,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
            --output json

          {
            echo "### Deployed to Lambda"
            echo ""
            echo '```'
            echo "$FUNCTION <- $REGISTRY/$REPOSITORY:$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop and remove container
        if: always()
        run: docker rm -f mcp-smoke || true

  # -------------------------------------------------------------------------
  # Slackbot image build (CTR-010/CTR-011, TASK-020's Dockerfile) + a
  # container-startup smoke test against *both* entry points that one image
  # exposes (AC-SB-008-3 handover scope) + gated ECR push/Lambda deploy.
  #
  # A separate job from `docker` above, not a `matrix` entry on it and not
  # steps appended to it, for two reasons verified while writing this job:
  #   1. `docker` above is the current production deploy path
  #      (mcp.devoks.kr) -- left completely untouched here.
  #   2. The two servers' smoke-test environments are large and genuinely
  #      different (4 required keys vs. 7, split by role, plus a second
  #      entry-point CMD override worker needs that management has no
  #      equivalent of) -- forcing them into one `matrix` job would need a
  #      per-entry env-var table keyed by matrix value, which reads worse
  #      than two plain jobs for saving a few lines of shared boilerplate
  #      (checkout, setup-buildx).
  # Same native arm64 runner class as `docker` above, same justification (no
  # QEMU anywhere, representative timing) -- this repository's arm64
  # runner-minute usage is still a small fraction of the free public-repo
  # allowance even with a second such job (handover note: ~7.5% before this
  # addition).
  # -------------------------------------------------------------------------
  docker-slackbot:
    name: Docker build (arm64) + /healthz smoke (handler+worker) + ECR push [slackbot]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build-context reasoning as the `docker` job's own `Build image`
      # step (uv.lock lives at the repository root, not under
      # servers/slackbot/) -- not repeated here.
      # `scope=slackbot` on the gha cache keeps this job's cache entries
      # separate from `docker`'s own (default-scope) entries -- the two
      # Dockerfiles share almost no layers (different `--package` target,
      # different final COPY set), so one shared scope would only add
      # gha-cache eviction churn for no reuse benefit.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/slackbot/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: devoks-slackbot:ci
          cache-from: type=gha,scope=slackbot
          cache-to: type=gha,mode=max,scope=slackbot

      # AC-SB-008-3 / TASK-020's "ONE IMAGE, TWO LAMBDAS" -- this step proves
      # the image's *default* `CMD` (the slack-handler entry point,
      # `devoks_slackbot.handler:create_app`) actually starts and answers
      # /healthz with only the handler-role required keys set
      # (config.py's `_COMMON_REQUIRED_KEYS + _HANDLER_REQUIRED_KEYS`,
      # verified by reading that module). Every value below is fake -- never
      # a real Slack/Anthropic credential -- generated at runtime and passed
      # to `docker run` via bare `-e VAR` (no `=literal` on the command
      # line), the same pattern the `docker` job's own smoke step above uses
      # for GITHUB_APP_PRIVATE_KEY, so nothing here needs to appear in this
      # script's own source text to be echoed by the Actions log.
      - name: Start slack-handler container and smoke-test /healthz
        run: |
          set -euo pipefail

          SLACK_SIGNING_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SLACK_BOT_TOKEN="$(python3 -c 'import secrets; print("xoxb-ci-smoke-" + secrets.token_urlsafe(24))')"
          export SLACK_SIGNING_SECRET SLACK_BOT_TOKEN

          # Identifiers, not credentials (config.py only requires non-empty
          # strings for these) -- never sent anywhere by a /healthz-only
          # smoke test, since that route never reaches slack/events.py or
          # the worker dispatch call.
          export SLACK_BOT_USER_ID="U0CISMOKE00"
          export IDEMPOTENCY_TABLE="ci-smoke-idempotency-table"
          export WORKER_FUNCTION_NAME="ci-smoke-worker-function"

          docker run -d --name slackbot-handler-smoke -p 8080:8080 \
            -e SLACK_SIGNING_SECRET \
            -e SLACK_BOT_TOKEN \
            -e SLACK_BOT_USER_ID \
            -e IDEMPOTENCY_TABLE \
            -e WORKER_FUNCTION_NAME \
            devoks-slackbot:ci

          status=""
          for attempt in $(seq 1 30); do
            if status=$(curl -s -o /tmp/slackbot-handler-healthz.json -w '%{http_code}' http://localhost:8080/healthz); then
              if [ "$status" = "200" ]; then
                echo "slack-handler GET /healthz -> 200 on attempt ${attempt}"
                break
              fi
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::slack-handler container did not answer GET /healthz with 200 within 30s (last status: ${status:-<connection failed>})"
              echo "--- docker logs slackbot-handler-smoke ---"
              docker logs slackbot-handler-smoke || true
              exit 1
            fi
            sleep 1
          done

          echo "--- slack-handler /healthz response body ---"
          cat /tmp/slackbot-handler-healthz.json
          echo

          # This package's /healthz body is {"status":"ok"} (handler.py's
          # `_healthz`, read directly) -- NOT management's {"name","version"}
          # shape above; copying that job's `grep -q '"name"'` check here
          # would fail against a correctly-behaving container. Parsed with
          # python's json module (not grep) so key spacing/order can't
          # produce a false negative either way.
          python3 -c "
          import json, sys
          with open('/tmp/slackbot-handler-healthz.json') as f:
              body = json.load(f)
          if body.get('status') != 'ok':
              print('::error::slack-handler /healthz responded 200 but body was', body)
              sys.exit(1)
          "

      - name: Dump slack-handler container logs (failure diagnostics)
        if: failure()
        run: docker logs slackbot-handler-smoke || true

      - name: Stop and remove slack-handler container
        if: always()
        run: docker rm -f slackbot-handler-smoke || true

      # TASK-023 provisions the slack-worker Lambda by overriding this same
      # image's `CMD` via `ImageConfig.Command` -- this is the only pre-deploy
      # proof that override actually works: `docker run`'s trailing argv
      # after the image name replaces `CMD` outright, the exact mechanism
      # `ImageConfig.Command` uses (verified against servers/slackbot/
      # Dockerfile's own CMD block comment). Required keys here are
      # `_COMMON_REQUIRED_KEYS + _WORKER_REQUIRED_KEYS` (config.py) --
      # deliberately omits `WORKER_FUNCTION_NAME` (handler-only) to prove the
      # worker role does not depend on it either.
      - name: Start slack-worker container (CMD override) and smoke-test /healthz
        run: |
          set -euo pipefail

          SLACK_SIGNING_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          SLACK_BOT_TOKEN="$(python3 -c 'import secrets; print("xoxb-ci-smoke-" + secrets.token_urlsafe(24))')"
          ANTHROPIC_API_KEY="$(python3 -c 'import secrets; print("sk-ant-ci-smoke-" + secrets.token_urlsafe(32))')"
          MCP_USER_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export SLACK_SIGNING_SECRET SLACK_BOT_TOKEN ANTHROPIC_API_KEY

          export SLACK_BOT_USER_ID="U0CISMOKE00"
          export IDEMPOTENCY_TABLE="ci-smoke-idempotency-table"
          # Must be a valid http(s) URL (config.py's `_parse_url`) -- reserved
          # example.com domain, same choice the `docker` job above makes for
          # MCP_PUBLIC_URL/MCP_ISSUER_URL, never a real MCP endpoint.
          export MCP_SERVER_URL="https://ci.example.com/mcp"
          # Must be a JSON object of non-empty string -> non-empty string
          # (config.py's `_parse_user_token_map`) -- one fake entry satisfies
          # startup validation; this /healthz-only smoke test never exercises
          # the credential lookup that would actually read it.
          export SLACK_USER_TOKEN_MAP="{\"U0CISMOKE00\":\"${MCP_USER_TOKEN}\"}"

          docker run -d --name slackbot-worker-smoke -p 8080:8080 \
            -e SLACK_SIGNING_SECRET \
            -e SLACK_BOT_TOKEN \
            -e SLACK_BOT_USER_ID \
            -e IDEMPOTENCY_TABLE \
            -e ANTHROPIC_API_KEY \
            -e MCP_SERVER_URL \
            -e SLACK_USER_TOKEN_MAP \
            devoks-slackbot:ci \
            /app/.venv/bin/uvicorn devoks_slackbot.worker:create_app --factory --host 0.0.0.0 --port 8080

          status=""
          for attempt in $(seq 1 30); do
            if status=$(curl -s -o /tmp/slackbot-worker-healthz.json -w '%{http_code}' http://localhost:8080/healthz); then
              if [ "$status" = "200" ]; then
                echo "slack-worker GET /healthz -> 200 on attempt ${attempt}"
                break
              fi
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::slack-worker container did not answer GET /healthz with 200 within 30s (last status: ${status:-<connection failed>})"
              echo "--- docker logs slackbot-worker-smoke ---"
              docker logs slackbot-worker-smoke || true
              exit 1
            fi
            sleep 1
          done

          echo "--- slack-worker /healthz response body ---"
          cat /tmp/slackbot-worker-healthz.json
          echo

          python3 -c "
          import json, sys
          with open('/tmp/slackbot-worker-healthz.json') as f:
              body = json.load(f)
          if body.get('status') != 'ok':
              print('::error::slack-worker /healthz responded 200 but body was', body)
              sys.exit(1)
          "

      - name: Dump slack-worker container logs (failure diagnostics)
        if: failure()
        run: docker logs slackbot-worker-smoke || true

      - name: Stop and remove slack-worker container
        if: always()
        run: docker rm -f slackbot-worker-smoke || true

      # -----------------------------------------------------------------
      # GATED push/deploy (AC-SB-008-3 handover: "기존 CI의 배포 경로를 탄다").
      # The ECR repository and both Lambda functions referenced below do not
      # exist yet (TASK-022/TASK-023 create them) -- an unconditional
      # `if: github.event_name == 'push'` here (the `docker` job's own gate)
      # would fail every push once this branch reaches `main`, for a reason
      # that has nothing to do with that push's own code.
      #
      # Gate: repository variable `vars.SLACKBOT_DEPLOY_ENABLED`. Unset (the
      # default -- no such variable exists yet) evaluates to an empty
      # string, so `== 'true'` is false and every step below is skipped;
      # the build + both smoke tests above run unconditionally either way.
      #
      # TO ENABLE (do this after TASK-022 + TASK-023 land, not before):
      #   1. Verify `infra/06-idempotency-table.sh` (TASK-022) and
      #      `infra/07-slackbot-lambda.sh` (TASK-023) created an ECR
      #      repository and two Lambda functions under the exact names this
      #      job's `REPOSITORY`/`HANDLER_FUNCTION`/`WORKER_FUNCTION` values
      #      reference below -- those three names are this task's own
      #      proposal (`devoks-slackbot` / `devoks-slack-handler` /
      #      `devoks-slack-worker`, following the `devoks-mcp-management`
      #      naming this repo already uses), not a value TASK-022/023 have
      #      confirmed. Update the values below first if the provisioning
      #      scripts used different names.
      #   2. Verify the OIDC role assumed below (`devoks-mcp-github-actions`,
      #      the same role the `docker` job uses for management) has been
      #      granted `ecr:*` on the new repository and
      #      `lambda:UpdateFunctionCode` + `lambda:GetFunctionConfiguration`
      #      on both new functions -- this job does not create or modify
      #      that IAM policy.
      #   3. Repo Settings -> Secrets and variables -> Actions -> Variables
      #      -> New repository variable: `SLACKBOT_DEPLOY_ENABLED` = `true`.
      # -----------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && vars.SLACKBOT_DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::703630528452:role/devoks-mcp-github-actions
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && vars.SLACKBOT_DEPLOY_ENABLED == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && vars.SLACKBOT_DEPLOY_ENABLED == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: devoks-slackbot
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag devoks-slackbot:ci "$REGISTRY/$REPOSITORY:$SHA"
          docker push "$REGISTRY/$REPOSITORY:$SHA"
          echo "pushed $REGISTRY/$REPOSITORY:$SHA"

          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            docker tag devoks-slackbot:ci "$REGISTRY/$REPOSITORY:latest"
            docker push "$REGISTRY/$REPOSITORY:latest"
            echo "pushed $REGISTRY/$REPOSITORY:latest"
          else
            echo "not the default branch - leaving :latest untouched"
          fi

          {
            echo "### Slackbot image pushed to ECR"
            echo ""
            echo '```'
            echo "$REGISTRY/$REPOSITORY:$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Same image, two Lambdas (DSN-SB-001) -- both functions are updated to
      # the one SHA-tagged image this job just built and smoke-tested on
      # both entry points. `update-function-code` only swaps the image,
      # leaving each function's own `ImageConfig.Command` (TASK-023's
      # handler/worker split) and environment variables untouched -- same
      # reasoning the `docker` job's own "Deploy to Lambda" step documents
      # for management.
      - name: Deploy to Lambda (slack-handler + slack-worker)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SLACKBOT_DEPLOY_ENABLED == 'true'
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: devoks-slackbot
          HANDLER_FUNCTION: devoks-slack-handler
          WORKER_FUNCTION: devoks-slack-worker
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$REGISTRY/$REPOSITORY:$SHA"

          for FUNCTION in "$HANDLER_FUNCTION" "$WORKER_FUNCTION"; do
            aws lambda update-function-code \
              --function-name "$FUNCTION" \
              --image-uri "$IMAGE_URI" \
              --publish \
              --query '{Version:Version,LastUpdateStatus:LastUpdateStatus}' \
              --output json

            aws lambda wait function-updated-v2 --function-name "$FUNCTION"

            aws lambda get-function-configuration --function-name "$FUNCTION" \
              --query '{State:State,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}' \
              --output json
          done

          {
            echo "### Deployed to Lambda"
            echo ""
            echo '```'
            echo "$HANDLER_FUNCTION <- $IMAGE_URI"
            echo "$WORKER_FUNCTION <- $IMAGE_URI"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
